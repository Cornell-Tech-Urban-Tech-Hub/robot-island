<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 32 32">
  <defs>
    <style>
      .robot-bg { fill: #0066FF; }
      .robot-detail { fill: #FFFFFF; }
      @media (prefers-color-scheme: dark) {
        .robot-bg { fill: #00C2FF; }
      }
    </style>
  </defs>

  <!-- Robot head -->
  <rect class="robot-bg" x="8" y="10" width="16" height="14" rx="2"/>

  <!-- Eyes -->
  <circle class="robot-detail" cx="13" cy="16" r="2"/>
  <circle class="robot-detail" cx="19" cy="16" r="2"/>

  <!-- Antenna -->
  <rect class="robot-bg" x="15" y="6" width="2" height="4"/>
  <circle class="robot-bg" cx="16" cy="5" r="2"/>

  <!-- Mouth -->
  <rect class="robot-detail" x="12" y="20" width="8" height="2" rx="1"/>

  <!-- Island wave base -->
  <path class="robot-bg" d="M4,26 Q8,24 12,26 T20,26 T28,26 L28,28 L4,28 Z" opacity="0.6"/>
</svg>
